name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache vcpkg + binary store
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}

      - name: Bootstrap vcpkg and install sundials
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          export VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg,readwrite"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 7281d8d64321f945f296e696d8561f68c8186c67
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install --classic sundials

      - name: Install Python package
        run: pip install -e ".[dev,test]"

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check src tests

      - name: Install OpenModelica and the standard library
        run: |
          curl -fsSL https://build.openmodelica.org/apt/openmodelica.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/openmodelica-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/openmodelica-keyring.gpg] https://build.openmodelica.org/apt $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/openmodelica.list >/dev/null
          sudo apt-get update && sudo apt-get install -y omc
          printf 'installPackage(Modelica);\n' > "$RUNNER_TEMP/install-msl.mos"
          omc "$RUNNER_TEMP/install-msl.mos"
          ls "$HOME/.openmodelica/libraries" | grep -q "^Modelica "

      - name: Generate fixture FMUs
        run: make generate-fixtures

      - name: Run unit and integration tests
        run: pytest -v -m "not verification" --ignore=tests/test_cs_behavior_verification.py

      - name: Run behavioral verification tests
        run: pytest -v -m "verification" tests/test_cs_behavior_verification.py
