[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-fmu-packager"
version = "0.1.1"
description = "Package FMI 2.0 Model Exchange FMUs into a single Co-Simulation FMU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "toml>=0.10",
    
    "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.2.dev0/experimental_pyssp_standard-0.9.2.dev0-py3-none-any.whl",
]

[project.scripts]
cs-fmu-packager = "cs_fmu_packager.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "fmpy>=0.3",
    "pandas>=2.0",
]
test = [
    "pytest>=7.0",
    "fmpy>=0.3",
    "numpy>=1.20",
    "pandas>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cs_fmu_packager" = ["c_headers/*", "codegen/*.h"]

[tool.pytest.ini_options]
markers = [
    "verification: behavioral verification tests requiring OMC and fmpy",
]