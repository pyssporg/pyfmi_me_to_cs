[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-fmu-packager"
version = "0.1.1"
description = "Package FMI 2.0 Model Exchange FMUs into a single Co-Simulation FMU"
readme = "cs-fmu-packager-project/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyssp-standard @ git+https://github.com/pyssporg/experimental_pyssp_standard@e2ac49a58481ca5af953965b1c00672103a97d67",
]

[project.scripts]
cs-fmu-packager = "cs_fmu_packager.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "fmpy>=0.3",
]
test = [
    "pytest>=7.0",
    "fmpy>=0.3",
    "numpy>=1.20",
    "pandas>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cs_fmu_packager" = ["c_headers/*", "codegen/*.h"]

[tool.pytest.ini_options]
markers = [
    "verification: behavioral verification tests requiring OMC and fmpy",
]